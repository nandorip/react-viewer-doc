<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>react-viewer-doc - Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f3f1ec;
      --surface: #fffcf8;
      --surface2: #efece6;
      --border: #e3ddd4;
      --text: #1c1915;
      --muted: #6f675e;
      --dim: #9a9186;
      --accent: #1f4d3a;
      --accent-soft: #e7f2ec;
      --ink: #14261d;
      --shadow: 0 1px 2px rgba(28, 25, 21, 0.05);
      --stage: #ebe6de;
    }
    body.dark {
      --bg: #121411;
      --surface: #1b1e1a;
      --surface2: #242824;
      --border: #323830;
      --text: #f3efe7;
      --muted: #b7b0a4;
      --dim: #8d867b;
      --accent: #8fbfa4;
      --accent-soft: #243028;
      --ink: #08110c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --stage: #0e100e;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }
    button, input { font: inherit; color: inherit; }
    .topbar, .page { max-width: 1180px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 16px 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--accent); color: #f7fff9;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    }
    body.dark .mark { color: var(--ink); }
    .brand h1 { font-size: 15px; font-weight: 650; letter-spacing: -0.03em; }
    .brand p { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .pill, .ghost, .load {
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 999px; cursor: pointer;
    }
    .pill { font-size: 12px; font-weight: 650; padding: 4px 9px; color: var(--accent); background: var(--accent-soft); }
    .ghost { padding: 7px 12px; font-size: 13px; font-weight: 600; }
    .page { padding: 8px 24px 40px; }
    .intro { margin: 8px 0 18px; }
    .intro h2 { font-size: 28px; letter-spacing: -0.045em; font-weight: 650; }
    .intro p { margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 46rem; }
    .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
    .side, .stage, .sample, .drop, .code, .card, .filebar {
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .side { border-radius: 18px; padding: 12px; position: sticky; top: 12px; }
    .drop {
      border-style: dashed; border-radius: 14px; padding: 18px 14px; text-align: left; cursor: pointer;
    }
    .drop strong { display: block; font-size: 14px; }
    .drop span, .hint, .sample small, .card p, .filebar span { color: var(--muted); }
    .drop span { display: block; margin-top: 4px; font-size: 12px; line-height: 1.45; }
    .formats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .formats i {
      font-style: normal; font-size: 11px; font-weight: 650;
      padding: 3px 7px; border-radius: 999px; background: var(--surface2); color: var(--muted);
    }
    .linkish {
      margin-top: 10px; background: none; border: 0; color: var(--accent);
      font-size: 13px; font-weight: 650; cursor: pointer; padding: 0;
    }
    .url-row { display: flex; gap: 6px; margin-top: 8px; }
    .url-row input {
      min-width: 0; flex: 1; border: 1px solid var(--border); background: var(--bg);
      border-radius: 10px; padding: 8px 10px; outline: none;
    }
    .load { border-radius: 10px; background: var(--accent); color: #f7fff9; border: 0; padding: 8px 12px; font-weight: 700; cursor: pointer; }
    body.dark .load { color: var(--ink); }
    .kicker {
      margin: 16px 4px 8px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
    }
    .samples { display: grid; gap: 6px; }
    .sample {
      display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: center;
      width: 100%; text-align: left; border-radius: 12px; padding: 8px 10px 8px 8px; cursor: pointer;
    }
    .sample b { display: block; width: 8px; align-self: stretch; border-radius: 99px; }
    .sample strong { display: block; font-size: 13px; font-weight: 640; }
    .sample small { font-size: 11px; }
    .sample.active { background: var(--accent-soft); border-color: transparent; }
    .stage { border-radius: 18px; overflow: hidden; }
    .stage-head {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      padding: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .modes { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface2); flex-wrap: wrap; }
    .modes button {
      border: 0; background: transparent; border-radius: 9px; padding: 7px 10px; cursor: pointer; text-align: left;
    }
    .modes button strong { display: block; font-size: 12px; }
    .modes button span { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
    .modes button.active { background: var(--surface); box-shadow: var(--shadow); }
    .filebar {
      display: flex; align-items: center; gap: 10px; margin: 0; padding: 8px 12px;
      border-width: 0 0 1px; border-radius: 0; box-shadow: none; font-size: 13px;
    }
    .filebar strong { font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filebar button {
      margin-left: auto; border: 1px solid var(--border); background: transparent;
      border-radius: 8px; padding: 4px 8px; cursor: pointer; color: var(--muted); font-size: 12px;
    }
    .empty {
      min-height: 460px; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--stage);
    }
    .empty strong { display: block; margin-top: 8px; }
    .empty span { color: var(--muted); font-size: 13px; }
    .viewer-frame { background: var(--stage); min-height: 460px; }
    .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
    .card { border-radius: 14px; padding: 14px; }
    .card strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .card p { font-size: 12px; line-height: 1.45; }
    .code { margin-top: 16px; border-radius: 16px; overflow: auto; }
    .code pre { margin: 0; padding: 18px 20px; font-size: 12.5px; line-height: 1.6; background: var(--surface2); }
    footer { margin-top: 22px; color: var(--dim); font-size: 12px; }
    @media (max-width: 860px) {
      .layout, .cards { grid-template-columns: 1fr; }
      .side { position: static; }
      .intro h2 { font-size: 24px; }
      .page, .topbar { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script src="./bundle.js"></script>
</body>
</html>
